<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../Image/icon.png">
    <title>Meow!</title>
    <style>
        body {
            font-family: Tahoma;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #000000;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 0;
            font-size: 48px;
            font-weight: bold;
        }

        /* Character-by-character wavy motion + automatic RGB color wave */
        .wavy-title span {
            display: inline-block;
            animation: characterWavyMove 2s ease-in-out infinite, rgbColorCycle 4s linear infinite;
        }

        @keyframes characterWavyMove {
            0% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(4px, -8px);
            }
            50% {
                transform: translate(0, -14px);
            }
            75% {
                transform: translate(-4px, -8px);
            }
            100% {
                transform: translate(0, 0);
            }
        }

        @keyframes rgbColorCycle {
            0% { color: #ff0000; }
            16% { color: #ff7f00; }
            33% { color: #ffff00; }
            50% { color: #00ff00; }
            66% { color: #00ffff; }
            83% { color: #0000ff; }
            100% { color: #ff0000; }
        }

        .image-wrapper {
            width: 100%;
            height: 600px;
            background-color: #000000; /* Changed to black so empty space blends in nicely */
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0 0 0;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Prevents cropping, shows the whole image */
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="wavyTitle" class="wavy-title">Meeooowwww!!!!!</h1>
        
        <!-- Wrapper keeps the image area a fixed size -->
        <div class="image-wrapper">
            <img id="catImage" src="https://cataas.com/cat/cute/says/meow!" alt="Random Cat">
        </div>
    </div>

    <script>
        // Splits title into individual character spans with staggered animation delays for wave and RGB
        window.addEventListener('DOMContentLoaded', () => {
            const title = document.getElementById('wavyTitle');
            const text = title.textContent;
            
            title.innerHTML = text.split('').map((char, index) => {
                if (char === ' ') {
                    return '&nbsp;';
                }
                const delay = index * 0.1;
                return `<span style="animation-delay: ${delay}s, ${delay}s;">${char}</span>`;
            }).join('');
        });

        function changeCat() {
            const img = document.getElementById('catImage');
            img.src = "https://cataas.com/cat/cute/says/MEOW!?t=" + new Date().getTime();
        }

        setInterval(changeCat, 3000);
    </script>

</body>
</html>
