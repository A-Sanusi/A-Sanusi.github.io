<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pauly Test Examiner</title>
  <style>
    body { font-family: Arial, sans-serif; }
    table { border-collapse: collapse; margin-bottom: 10px; }
    th, td { border: 1px solid #ccc; text-align: center; padding: 0; }
    input[type="text"] { width: 40px; height: 25px; border: none; text-align: center; font-size: 14px; }
    input:focus { outline: none; background-color: #e0f7fa; }
    .row-header, .col-header { background-color: #f0f0f0; font-weight: bold; }
    .page { display: none; }
    .page.active { display: table; }
    .controls { margin-bottom: 10px; }
    #output { white-space: pre-wrap; background: #f9f9f9; padding: 10px; border: 1px solid #ccc; max-height: 400px; overflow-y: auto; }
    #chart-container { width: 100%; max-width: 900px; height: 400px; margin-top: 20px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>Pauly Test Examiner</h2>

<div id="table-container"></div>

<div class="controls">
  <button onclick="prevPage()">Previous Page</button>
  <span id="page-number">Page 1</span>
  <button onclick="nextPage()">Next Page</button>
</div>

<button onclick="analyze()">Analyze Results</button>

<pre id="output"></pre>

<div id="chart-container">
  <canvas id="calculation-chart"></canvas>
</div>

<script>
  const ROWS = 50;
  const COLUMNS = 160;
  const COLUMNS_PER_PAGE = 30;
  const TOTAL_PAGES = Math.ceil(COLUMNS / COLUMNS_PER_PAGE);
  let currentPage = 0;
  let correctAnswers = [];
  let results = Array.from({ length: 20 }, () => ({ calculations: 0, correct: 0, incorrect: 0, corrections: 0 }));

  const tableContainer = document.getElementById("table-container");

  for (let page = 0; page < TOTAL_PAGES; page++) {
    const table = document.createElement("table");
    table.classList.add("page");
    if (page === 0) table.classList.add("active");
    table.id = `page-${page}`;

    const header = document.createElement("tr");
    header.appendChild(document.createElement("th"));
    for (let c = 0; c < COLUMNS_PER_PAGE; c++) {
      const th = document.createElement("th");
      th.textContent = page * COLUMNS_PER_PAGE + c + 1;
      th.classList.add("col-header");
      header.appendChild(th);
    }
    table.appendChild(header);

    for (let r = 0; r < ROWS; r++) {
      const row = document.createElement("tr");
      const th = document.createElement("td");
      th.textContent = r + 1;
      th.classList.add("row-header");
      row.appendChild(th);

      for (let c = 0; c < COLUMNS_PER_PAGE; c++) {
        const colIndex = page * COLUMNS_PER_PAGE + c;
        if (colIndex >= COLUMNS) break;

        const td = document.createElement("td");
        const input = document.createElement("input");
        input.type = "text";
        input.dataset.row = r;
        input.dataset.col = colIndex;
        td.appendChild(input);
        row.appendChild(td);
      }

      table.appendChild(row);
    }

    tableContainer.appendChild(table);
  }

  function updatePageNumber() {
    document.getElementById("page-number").textContent = `Page ${currentPage + 1}`;
  }

  function prevPage() {
    if (currentPage > 0) {
      document.getElementById(`page-${currentPage}`).classList.remove("active");
      currentPage--;
      document.getElementById(`page-${currentPage}`).classList.add("active");
      updatePageNumber();
    }
  }

  function nextPage() {
    if (currentPage < TOTAL_PAGES - 1) {
      document.getElementById(`page-${currentPage}`).classList.remove("active");
      currentPage++;
      document.getElementById(`page-${currentPage}`).classList.add("active");
      updatePageNumber();
    }
  }

  // Load CSV automatically
  window.addEventListener("DOMContentLoaded", () => {
    fetch("pauliz.csv")
      .then(res => res.text())
      .then(csv => {
        const lines = csv.trim().split("\n");
        correctAnswers = lines.map(line => line.split(",").map(cell => cell.trim()));
        console.log("CSV loaded", correctAnswers);
      })
      .catch(err => console.error("CSV load failed:", err));
  });

  function analyze() {
    results = Array.from({ length: 20 }, () => ({ calculations: 0, correct: 0, incorrect: 0, corrections: 0 }));
    let period = 0;

    for (let col = 0; col < COLUMNS; col++) {
      for (let row = 0; row < ROWS; row++) {
        const input = document.querySelector(`input[data-row="${row}"][data-col="${col}"]`);
        const value = input?.value.trim().toUpperCase();
        if (!value) continue;

        const digit = value[0];
        const isCorrection = value.includes("X");
        const hasG = value.includes("G");

        results[period].calculations++;

        const correct = correctAnswers[row][col]; // Correct answer is from the csv, row x col
        const isCorrect = digit === correct;

        if (isCorrection) {
          if (isCorrect) results[period].corrections++;
          else results[period].incorrect++;
        } else {
          if (isCorrect) results[period].correct++;
          else results[period].incorrect++;
        }

        if (hasG && period < 19) period++;
      }
    }

    const output = document.getElementById("output");
    let summary = '';
    const calcChartData = [];

    for (let i = 0; i < 20; i++) {
      const r = results[i];
      summary += `Period ${i + 1}:\n  Calculations: ${r.calculations}\n  Right: ${r.correct}\n  Wrong: ${r.incorrect}\n  Corrections: ${r.corrections}\n\n`;
      calcChartData.push(r.calculations);
    }

    const seg = [
      results.slice(0, 5),
      results.slice(5, 17),
      results.slice(17, 20)
    ];
    seg.forEach((s, i) => {
      const totals = s.reduce((a, b) => ({
        calculations: a.calculations + b.calculations,
        correct: a.correct + b.correct,
        incorrect: a.incorrect + b.incorrect,
        corrections: a.corrections + b.corrections
      }), { calculations: 0, correct: 0, incorrect: 0, corrections: 0 });
      summary += `Segment ${i + 1}:\n  Calculations: ${totals.calculations}\n  Right: ${totals.correct}\n  Wrong: ${totals.incorrect}\n  Corrections: ${totals.corrections}\n\n`;
    });

    output.textContent = summary;

    const ctx = document.getElementById('calculation-chart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: Array.from({ length: 20 }, (_, i) => `Period ${i + 1}`),
        datasets: [{
          label: 'Calculations per Period',
          data: calcChartData,
          borderColor: 'blue',
          backgroundColor: 'rgba(0, 0, 255, 0.1)',
          tension: 0.2,
          fill: true
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }

  // Enable arrow key navigation
  document.addEventListener("keydown", function (e) {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
      const active = document.activeElement;
      if (active.tagName === "INPUT") {
        e.preventDefault();
        const row = parseInt(active.dataset.row);
        const col = parseInt(active.dataset.col);
        let nextInput;
        if (e.key === "ArrowRight") nextInput = document.querySelector(`input[data-row="${row}"][data-col="${col + 1}"]`);
        if (e.key === "ArrowLeft") nextInput = document.querySelector(`input[data-row="${row}"][data-col="${col - 1}"]`);
        if (e.key === "ArrowDown") nextInput = document.querySelector(`input[data-row="${row + 1}"][data-col="${col}"]`);
        if (e.key === "ArrowUp") nextInput = document.querySelector(`input[data-row="${row - 1}"][data-col="${col}"]`);
        if (nextInput) nextInput.focus();
      }
    }
  });
</script>

</body>
</html>
